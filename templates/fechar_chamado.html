<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Fechar Chamado - HelpDesk IT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-warning text-dark">
                        <h4>Encerrar Chamado #{{ chamado[0] }}</h4>
                    </div>
                    <div class="card-body">
                        <p><strong>Solicitante:</strong> {{ chamado[3] }}</p>
                        <p><strong>Título:</strong> {{ chamado[1] }}</p>
                        <p><strong>Descrição:</strong> {{ chamado[2] }}</p>
                        <hr>
                        <form method="POST">
                            <div class="mb-3">
                                <label for="resolucao" class="form-label">Detalhes da Resolução / Diagnóstico Técnico</label>
                                <textarea class="form-control" id="resolucao" name="resolucao" rows="4" required placeholder="Descreva o procedimento executado para resolver o problema..."></textarea>
                            </div>
                            <button type="submit" class="btn btn-danger">Confirmar Encerramento</button>
                            <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancelar</a>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
