<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Novo Chamado - HelpDesk IT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h4>Abrir Novo Chamado de Suporte</h4>
                    </div>
                    <div class="card-body">
                        <form method="POST">
                            <div class="mb-3">
                                <label for="solicitante" class="form-label">Nome do Solicitante</label>
                                <input type="text" class="form-control" id="solicitante" name="solicitante" required placeholder="Ex: Maria Silva (RH)">
                            </div>
                            <div class="mb-3">
                                <label for="titulo" class="form-label">Título do Problema</label>
                                <input type="text" class="form-control" id="titulo" name="titulo" required placeholder="Ex: Erro ao aceder à VPN corporativa">
                            </div>
                            <div class="mb-3">
                                <label for="descricao" class="form-label">Descrição Detalhada</label>
                                <textarea class="form-control" id="descricao" name="descricao" rows="4" required placeholder="Descreva o incidente com detalhes..."></textarea>
                            </div>
                            <button type="submit" class="btn btn-success">Registar Chamado</button>
                            <a href="{{ url_for('index') }}" class="btn btn-secondary">Voltar</a>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
