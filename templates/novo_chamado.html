<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Novo Chamado - HelpDesk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5" style="max-width: 600px;">
        <div class="card shadow-sm">
            <div class="card-body">
                <h3 class="mb-4">Abrir Novo Chamado de Suporte</h3>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Título do Problema</label>
                        <input type="text" class="form-control" name="titulo" required placeholder="Ex: Erro de conexão VPN / Coletor CK65">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Descrição Detalhada</label>
                        <textarea class="form-control" name="descricao" rows="4" required placeholder="Descreva o sintoma e o equipamento afetado..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-success">Salvar Chamado</button>
                    <a href="/" class="btn btn-secondary">Voltar</a>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
